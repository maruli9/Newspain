const app=document.getElementById('app');let page='home',index=0,game=null,speakIndex=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dueIds(){return data.map((_,i)=>i).filter(i=>progress[i]?.next&&progress[i].next<=today()).sort((a,b)=>progress[a].next.localeCompare(progress[b].next))}

function home(){let d=dayRecord(),mins=d.minutes||0;let due=dueIds().length,learned=Object.values(progress).filter(p=>p.seen).length;let tasks=[['5 min','Powtórki','review'],['8 min','5 nowych zdań','sentences'],['7 min','Mówienie na głos','speaking'],['5 min','Quiz lub słuchanie','quiz'],['5 min','Gramatyka','grammar']];app.innerHTML=`<div class="card"><span class="badge">Twój trening na dziś</span><h2 style="margin-top:12px">¡Vamos a aprender! 🇪🇸</h2><p>Cel: <b>30 minut dziennie</b></p><div class="bar"><span style="width:${Math.min(100,mins/30*100)}%"></span></div><p class="small">${mins} / 30 minut — czas zaznaczasz po wykonaniu ćwiczenia</p><div class="grid"><div class="tile">🔥 Seria dni<b>${streak()}</b></div><div class="tile">⭐ Punkty XP<b>${stats.xp||0}</b></div><div class="tile">📚 Poznane zdania<b>${learned} / ${data.length}</b></div><div class="tile">🧠 Do powtórki<b>${due}</b></div></div></div><div class="card"><h2>Plan 30 minut</h2>${tasks.map(t=>`<div class="task"><div><b>${t[1]}</b><div class="small">${t[0]}</div></div><button class="btn primary" onclick="setPage('${t[2]}')">Ćwicz →</button></div>`).join('')}<p class="small">Po ćwiczeniu zaznacz przepracowany czas:</p><div class="actions"><button class="btn" onclick="minutesAdd(5)">+5 minut</button><button class="btn" onclick="minutesAdd(10)">+10 minut</button><button class="btn" onclick="minutesAdd(15)">+15 minut</button></div>${mins>=30?'<p>🏆 Brawo! Dzisiejszy cel osiągnięty.</p>':''}</div><div class="card"><h2>Twój następny krok</h2><p>${due?'Masz '+due+' zdań do powtórzenia.':'Brak zaległych powtórek. Poznaj kolejne zdania!'}</p><button class="btn primary" onclick="setPage('${due?'review':'sentences'}')">Zaczynam →</button></div>`}
function render(){if(page==='home'){home();return}if(page==='sentences'){app.innerHTML='<div class="card"><h2>📚 Zdania</h2><p class="small">Posłuchaj, zapisz ulubione i oznacz, czy znasz zdanie.</p><input placeholder="🔎 Szukaj po hiszpańsku lub polsku" oninput="search(this.value)"></div><div id="results">'+sentence(index)+navigation()+'</div>';return}if(page==='favorites'){app.innerHTML='<div class="card"><h2>❤️ Ulubione ('+fav.length+')</h2><p class="small">Twoje zapisane zdania z poprzedniej wersji.</p></div>'+(fav.length?fav.filter(i=>data[i]).map(sentence).join(''):'<div class="card">Nie masz jeszcze ulubionych.</div>');return}if(page==='review'){let ids=dueIds();app.innerHTML='<div class="card"><h2>🧠 Inteligentne powtórki</h2><p>Oceń zdanie jako „Znam” lub „Trudne”. Dobrze znane zdania wrócą za 3, 7, 14 lub 30 dni.</p><span class="badge">Dzisiaj do powtórki: '+ids.length+'</span></div>'+(ids.length?ids.slice(0,10).map(sentence).join(''):'<div class="card">🎉 Wszystkie zaplanowane powtórki gotowe! W sekcji Zdania oznacz nowe zdania jako „Znam” lub „Trudne”.</div>');return}if(page==='grammar'){grammar();return}if(page==='progress'){progressPage();return}if(page==='coach'){coachPage();return}if(page==='words'){wordsPage();return}if(page==='speaking'){speaking();return}if(!game){app.innerHTML='<div class="card"><h2>'+(page==='quiz'?'🏆 Quiz zdań':'🎧 Słuchanie')+'</h2><p>'+(page==='quiz'?'Wybierz poprawne tłumaczenie.':'Odsłuchaj zdanie i wybierz jego znaczenie.')+'</p><div class="actions"><button class="btn primary" onclick="start(10)">10 pytań</button><button class="btn primary" onclick="start(20)">20 pytań</button></div></div>';return}question()}
function start(n){game={ids:shuffle(data.map((_,i)=>i)).slice(0,n),at:0,score:0,choice:null,options:null};question()}
function question(){if(game.at>=game.ids.length&&!game.saved){game.saved=true;stats.quizHistory=stats.quizHistory||[];stats.quizHistory.push({date:today(),score:game.score,total:game.ids.length});stats.quizHistory=stats.quizHistory.slice(-100);save();logActivity('quiz')}if(game.at>=game.ids.length){app.innerHTML='<div class="card"><h2>🎉 Koniec quizu!</h2><div class="es">'+game.score+' / '+game.ids.length+'</div><p>+3 XP za ukończenie</p><div class="actions"><button class="btn primary" onclick="start('+game.ids.length+')">Jeszcze raz</button><button class="btn" onclick="game=null;render()">Wróć</button></div></div>';return}let id=game.ids[game.at];if(!game.options)game.options=shuffle([id,...shuffle(data.map((_,i)=>i).filter(i=>i!==id)).slice(0,3)]);let listen=page==='listening';let html='<div class="card"><span class="badge">Pytanie '+(game.at+1)+' / '+game.ids.length+' · '+game.score+' pkt</span>'+(listen?'<p>Odsłuchaj zdanie:</p><button class="btn primary" onclick="speak(data['+id+'][0])">🔊 Odtwórz</button>':'<div class="es">'+escapeHtml(data[id][0])+'</div><button class="btn" onclick="speak(data['+id+'][0])">🔊 Posłuchaj</button>');game.options.forEach((v,k)=>{let cls=game.choice!==null?(v===id?'correct':k===game.choice?'wrong':''):'';html+='<button class="option '+cls+'" '+(game.choice!==null?'disabled':'')+' onclick="answer('+k+')">'+'ABCD'[k]+'. '+escapeHtml(data[v][1])+'</button>'});if(game.choice!==null)html+='<p><b>'+(game.options[game.choice]===id?'✅ Dobrze!':'❌ Poprawnie: '+escapeHtml(data[id][1]))+'</b></p><button class="btn primary" onclick="next()">Dalej →</button>';app.innerHTML=html+'</div>'}

function normalize(s){return s.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zñ0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function recognize(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;let out=document.getElementById('speechResult');if(!SR){out.textContent='Ta przeglądarka nie udostępnia rozpoznawania mowy. Powtarzaj na głos i użyj „Powtórzyłem”.';return}let r=new SR();r.lang='es-ES';r.interimResults=false;r.maxAlternatives=1;out.textContent='🎤 Słucham…';r.onresult=e=>{let heard=e.results[0][0].transcript;let expected=data[speakIndex][0];let a=normalize(heard).split(' '),b=normalize(expected).split(' ');let hits=a.filter(x=>b.includes(x)).length;let score=Math.round(100*hits/Math.max(a.length,b.length));out.textContent='Rozpoznano: '+heard+' · zgodność słów około '+score+'%. To porównanie tekstu, nie profesjonalna ocena wymowy.';logActivity('speaking')};r.onerror=e=>{out.textContent='Mikrofon niedostępny ('+e.error+'). Możesz ćwiczyć bez automatycznej oceny.'};try{r.start()}catch(e){out.textContent='Nie udało się uruchomić mikrofonu.'}}

 const keys=Array.from({length:7},(_,i)=>dateShift(i-6));
 const values=keys.map(k=>Math.min(30,stats.days[k]?.minutes||0));
 const max=30, w=340,h=160, left=16,base=126,barW=27,step=46;
 let bars=values.map((v,i)=>{
  let bh=v/max*105,x=left+i*step,y=base-bh;
  let label=keys[i].slice(8);
  return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(1,bh)}" rx="5" fill="${v>=30?'#1e987b':'#2188a3'}"/><text x="${x+barW/2}" y="${Math.max(12,y-5)}" font-size="10" text-anchor="middle" fill="#38566a">${v}</text><text x="${x+barW/2}" y="146" font-size="10" text-anchor="middle" fill="#627c8d">${label}</text>`;
 }).join('');
 let completed=Object.values(progress).filter(p=>p.seen).length;
 let known=Object.values(progress).filter(p=>(p.level||0)>=2).length;
 let q=stats.quizHistory||[];
 let last=q.slice(-5);
 let accuracy=last.length?Math.round(last.reduce((sum,r)=>sum+r.score,0)/last.reduce((sum,r)=>sum+r.total,0)*100):null;
 let days30=values.filter(v=>v>=30).length;
 app.innerHTML=`<div class="card"><h2>📊 Twoje postępy</h2><p class="hint">Ostatnie 7 dni — zaznaczone minuty nauki. Zielony słupek oznacza osiągnięty cel 30 minut.</p>
 <svg class="chart" viewBox="0 0 340 160" role="img" aria-label="Wykres czasu nauki z ostatnich siedmiu dni"><line x1="12" y1="126" x2="338" y2="126" stroke="#cddde5"/><line x1="12" y1="21" x2="338" y2="21" stroke="#cddde5" stroke-dasharray="3 4"/>${bars}</svg>
 <div class="grid"><div class="tile">🎯 Dni z celem<b>${days30} / 7</b></div><div class="tile">🔥 Seria dni<b>${streak()}</b></div><div class="tile">📚 Poznane zdania<b>${completed} / ${data.length}</b></div><div class="tile">🧠 Utrwalone zdania<b>${known}</b></div></div></div>
 <div class="card"><h3>Wyniki quizów</h3><div class="metric">${accuracy===null?'—':accuracy+'%'}</div><p class="hint">Skuteczność z ostatnich ${last.length} quizów. To wynik ćwiczeń, nie ogólna ocena znajomości języka.</p><div class="bar"><span style="width:${accuracy||0}%"></span></div></div>
 <div class="card"><h3>Wskazówka Coacha</h3><p>${coachAdvice()}</p><button class="btn primary" onclick="setPage('coach')">🧑‍🏫 Przejdź do Coacha</button></div>`;
}
function coachAdvice(){
 const due=dueIds().length,learned=Object.values(progress).filter(p=>p.seen).length;
 const d=dayRecord(),mins=d.minutes||0;
 const qs=(stats.quizHistory||[]).slice(-3);
 const acc=qs.length?qs.reduce((n,q)=>n+q.score,0)/qs.reduce((n,q)=>n+q.total,0):null;
 if(due>0)return `Masz ${due} zdań do powtórki. Zacznij od nich — to najlepszy sposób, by nie zapominać.`;
 if(acc!==null&&acc<.7)return 'W ostatnich quizach zdarzały się pomyłki. Wróć do zdań i odsłuchaj je przed kolejnym testem.';
 if(mins<30)return `Dzisiaj zaznaczono ${mins} z 30 minut. Wybierz krótkie ćwiczenie, aby zbliżyć się do celu.`;
 if(learned<20)return 'Świetnie, dzisiejszy cel osiągnięty! Poznaj kolejne pięć zdań i wypowiedz je na głos.';
 return 'Dobra regularność! Spróbuj dziś wypowiedzieć 5 zdań bez patrzenia na tłumaczenie.';
}

 {context:'W kawiarni',prompt:'Kelner pyta: ¿Qué desea tomar?',choices:['Quiero un café, por favor.','Estoy en la estación.','Hace mucho frío.'],correct:0,why:'Quiero un café, por favor. = Poproszę kawę. To naturalna odpowiedź w kawiarni.'},

];

let wordGame=null;
function startWordGame(direction,count){let ids=shuffle(wordData.map((_,i)=>i));wordGame={direction,ids:ids.slice(0,count),at:0,score:0,choice:null,options:null};wordQuestion()}
function wordQuestion(){if(!wordGame)return;let g=wordGame;if(g.at>=g.ids.length){app.innerHTML=`<div class="card"><h2>🎉 Koniec quizu słówek</h2><div class="es">${g.score} / ${g.ids.length}</div><button class="btn primary" onclick="wordGame=null;render()">Nowy quiz</button></div>`;return}
let id=g.ids[g.at],direction=g.direction,source=wordData[id],prompt=direction==='espl'?source[0]:source[1];
if(!g.options)g.options=shuffle([id,...shuffle(wordData.map((_,i)=>i).filter(i=>i!==id&&wordData[i][direction==='espl'?1:0]!==source[direction==='espl'?1:0])).slice(0,3)]);
let s=`<div class="card"><span class="badge">Słówko ${g.at+1} / ${g.ids.length} · ${g.score} pkt</span><h2>${direction==='espl'?'Hiszpański → polski':'Polski → hiszpański'}</h2><div class="es">${escapeHtml(prompt)}</div><button class="btn" onclick="speak(wordData[${id}][0])">🔊 Wymowa</button>`;
g.options.forEach((v,k)=>{let correct=v===id,cls=g.choice!==null?(correct?'correct':k===g.choice?'wrong':''):'';s+=`<button class="option ${cls}" ${g.choice!==null?'disabled':''} onclick="wordAnswer(${k})">${'ABCD'[k]}. ${escapeHtml(wordData[v][direction==='espl'?1:0])}</button>`});
if(g.choice!==null)s+=`<p><b>${g.options[g.choice]===id?'✅ Dobrze!':'❌ Poprawnie: '+escapeHtml(source[direction==='espl'?1:0])}</b></p><button class="btn primary" onclick="wordNext()">Dalej →</button>`;
app.innerHTML=s+'</div>'}
function wordAnswer(k){if(wordGame.choice!==null)return;wordGame.choice=k;if(wordGame.options[k]===wordGame.ids[wordGame.at]){wordGame.score++;reward(1)}wordQuestion()}
function wordNext(){wordGame.at++;wordGame.choice=null;wordGame.options=null;wordQuestion()}
function wordsPage(){if(wordGame){wordQuestion();return}app.innerHTML=`<div class="card"><h2>🧩 Quiz słówek</h2><p>Ćwicz pojedyncze słowa w obu kierunkach. ${wordData.length} haseł z rodzajnikami w bazie.</p><div class="actions"><button class="btn primary" onclick="startWordGame('espl',10)">🇪🇸 → 🇵🇱 · 10</button><button class="btn primary" onclick="startWordGame('ples',10)">🇵🇱 → 🇪🇸 · 10</button><button class="btn" onclick="startWordGame('espl',20)">🇪🇸 → 🇵🇱 · 20</button><button class="btn" onclick="startWordGame('ples',20)">🇵🇱 → 🇪🇸 · 20</button></div></div>`}
let coachSentenceIndex=220,coachHeard='',coachFeedback='',coachListening=false;
function coachPage(){
 const target=data[coachSentenceIndex];
 app.innerHTML=`<div class="card"><span class="badge">🎤 Coach praktyczny • zdanie ${coachSentenceIndex+1} / ${data.length}</span>
 <h2>Powiedz to po hiszpańsku</h2><div class="pl" style="font-size:21px;margin:15px 0">${escapeHtml(target[1])}</div>
 <div class="actions"><button class="btn primary" onclick="coachListen()">🎤 ${coachListening?'Słucham…':'Odpowiedz głosem'}</button><button class="btn" onclick="coachReveal()">👁️ Pokaż wzór</button><button class="btn" onclick="speak(data[coachSentenceIndex][0])">🔊 Posłuchaj wzoru</button></div>
 <p class="small">Jeśli mikrofon nie zadziała, wpisz odpowiedź poniżej.</p>
 <input id="coachTyped" placeholder="Napisz zdanie po hiszpańsku" autocomplete="off" autocapitalize="off" value="${escapeHtml(coachHeard).replace(/&quot;/g,'&quot;')}">
 <div class="actions"><button class="btn primary" onclick="coachCheck(document.getElementById('coachTyped').value)">✓ Sprawdź odpowiedź</button><button class="btn" onclick="coachAdvance()">Następne zdanie →</button></div>
 <div id="coachResult" class="note" style="margin-top:15px" aria-live="polite">${coachFeedback||'Spróbuj powiedzieć zdanie własnymi słowami.'}</div></div>
 <div class="card"><h3>Jak działa ocena?</h3><p class="small">Coach porównuje rozpoznane słowa z przykładowym zdaniem, wskazuje brakujące i dodatkowe słowa. Nie rozumie dowolnych parafraz i nie ocenia jakości akcentu. Rozpoznawanie mowy zależy od przeglądarki; na niektórych iPhone’ach może być niedostępne.</p></div>`;
}
function coachListen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){coachFeedback='⚠️ Ta przeglądarka nie udostępnia rozpoznawania mowy. Wpisz odpowiedź w polu i kliknij „Sprawdź odpowiedź”.';coachPage();return;}
 const rec=new SR();rec.lang='es-ES';rec.interimResults=false;rec.maxAlternatives=1;
 coachListening=true;coachFeedback='🎤 Słucham. Powiedz zdanie po hiszpańsku.';coachPage();
 rec.onresult=e=>{coachListening=false;coachCheck(e.results[0][0].transcript)};
 rec.onerror=e=>{coachListening=false;coachFeedback='⚠️ Mikrofon: '+escapeHtml(e.error)+'. Możesz wpisać odpowiedź ręcznie.';coachPage()};
 rec.onend=()=>{if(coachListening){coachListening=false;coachFeedback='Nie wykryto wypowiedzi. Spróbuj ponownie albo wpisz odpowiedź.';coachPage()}};
 try{rec.start()}catch(e){coachListening=false;coachFeedback='Nie udało się uruchomić mikrofonu. Wpisz odpowiedź ręcznie.';coachPage()}
}
function coachCheck(heard){
 coachHeard=heard.trim();
 if(!coachHeard){coachFeedback='Najpierw powiedz lub wpisz zdanie.';coachPage();return;}
 const expected=data[coachSentenceIndex][0],a=normalize(coachHeard).split(' ').filter(Boolean),b=normalize(expected).split(' ').filter(Boolean);
 // Multiset comparison: repeated words are counted correctly.
 const remaining=[...a],missing=[];
 for(const w of b){const k=remaining.indexOf(w);if(k<0)missing.push(w);else remaining.splice(k,1)}
 const matched=b.length-missing.length,precision=matched/Math.max(a.length,1),recall=matched/Math.max(b.length,1);
 const score=Math.round(100*(precision+recall?2*precision*recall/(precision+recall):0));
 const orderMatches=a.length===b.length&&a.every((w,i)=>w===b[i]);
 const success=score>=85&&orderMatches;
 coachFeedback=`<b>${success?'✅ Bardzo dobrze!':'💡 Popracujmy nad zdaniem.'}</b><p><b>Rozpoznano / wpisano:</b> ${escapeHtml(coachHeard)}</p><p><b>Przykładowa odpowiedź:</b> ${escapeHtml(expected)}</p><p><b>Zgodność słów:</b> ${score}%${!orderMatches&&score>=85?' — sprawdź też kolejność wyrazów.':''}</p>`
 +(missing.length?`<p><b>Brakujące lub inne słowa:</b> ${escapeHtml(missing.join(', '))}</p>`:'')
 +(remaining.length?`<p><b>Dodatkowe słowa:</b> ${escapeHtml(remaining.join(', '))}</p>`:'')
 +`<p class="small">To porównanie ze wzorem, nie ocena wymowy ani poprawności wszystkich możliwych odpowiedzi.</p>`;
 if(success){reward(2);logActivity('speaking')}
 coachPage();
}
function coachReveal(){coachFeedback='<b>Przykładowa odpowiedź:</b> '+escapeHtml(data[coachSentenceIndex][0]);coachPage()}
function coachAdvance(){coachSentenceIndex=(coachSentenceIndex+1)%data.length;coachHeard='';coachFeedback='';coachPage()}

render();
