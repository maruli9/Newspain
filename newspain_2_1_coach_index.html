<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15344a"><title>NewSpain 2.1 • Coach i postępy</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#183044;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{padding:23px 18px;background:linear-gradient(125deg,#15344a,#18778e);color:white}header h1{margin:0;font-size:29px}header p{margin:7px 0 0;opacity:.85}main{max-width:750px;margin:auto;padding:14px 13px 90px}nav{display:flex;gap:7px;overflow-x:auto;padding-bottom:14px}button{font:inherit;cursor:pointer}nav button,.btn{border:0;border-radius:12px;padding:12px 13px;background:#eaf1f5;color:#1a4758}nav button{background:white;white-space:nowrap}nav button.active,.primary{background:#18738b!important;color:white!important}.card{background:white;border-radius:19px;padding:19px;margin-bottom:13px;box-shadow:0 3px 16px #193a5010}.es{font-size:25px;line-height:1.4;font-weight:750;margin:17px 0}.pl{font-size:17px;color:#52687b;line-height:1.5}.small{font-size:13px;color:#718392}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.heart{color:#cb4669}.option{display:block;width:100%;padding:14px;text-align:left;margin:9px 0;background:#f5f8fa;border:1px solid #dbe5eb;border-radius:12px}.correct{background:#e1f7eb!important;border-color:#34a16b!important}.wrong{background:#ffe6eb!important;border-color:#d85270!important}.option:disabled{opacity:1}input{width:100%;padding:13px;border:1px solid #d6e2ea;border-radius:12px;font:inherit}.note{background:#eaf4f6;padding:13px;border-radius:12px;line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{padding:14px;background:#f0f6f8;border-radius:14px}.tile b{display:block;font-size:22px;margin-top:4px}.bar{height:10px;background:#e4ecf0;border-radius:12px;overflow:hidden}.bar span{display:block;height:100%;background:#1a8aa3;border-radius:12px}.badge{display:inline-block;background:#e5f4f8;border-radius:20px;padding:6px 10px;color:#156d85;font-size:12px}.task{display:flex;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid #eef2f5}.task:last-child{border:0}h2{margin:0 0 12px}h3{margin:0 0 8px}footer{text-align:center;font-size:12px;color:#778997;padding:18px}button:focus-visible{outline:3px solid #ffbc52;outline-offset:2px}.chart{width:100%;height:auto;display:block}.coachBubble{padding:14px;border-radius:14px;background:#eaf4f6;line-height:1.6;margin:12px 0}.coachBubble.user{background:#f4f0ff}.coachChoice{display:block;width:100%;text-align:left;margin:9px 0;white-space:normal}.metric{font-size:28px;font-weight:800}.hint{color:#51697a;font-size:14px;line-height:1.5}</style></head><body><header><h1>🇪🇸 NewSpain 2.1</h1><p>Twój trener hiszpańskiego • 30 minut dziennie</p></header><main><nav id="tabs"><button class="active" data-page="home">🏠 Dzisiaj</button><button data-page="sentences">📚 Zdania</button><button data-page="favorites">❤️ Ulubione</button><button data-page="review">🧠 Powtórki</button><button data-page="quiz">🏆 Quiz</button><button data-page="listening">🎧 Słuchanie</button><button data-page="speaking">🎤 Mówienie</button><button data-page="grammar">📖 Gramatyka</button><button data-page="progress">📊 Postępy</button><button data-page="coach">🧑‍🏫 Coach</button></nav><div id="app"></div><footer>Wyniki zapisują się na tym urządzeniu. Rozpoznawanie mowy zależy od obsługi przeglądarki.</footer></main><script>
const data=[["Hola, ¿cómo estás?", "Cześć, jak się masz?"], ["Estoy muy bien, gracias.", "Mam się bardzo dobrze, dziękuję."], ["¿Cómo te llamas?", "Jak masz na imię?"], ["Me llamo Ana.", "Mam na imię Ana."], ["Mucho gusto.", "Miło mi."], ["¿De dónde eres?", "Skąd jesteś?"], ["Soy de Polonia.", "Jestem z Polski."], ["Vivo en Viena.", "Mieszkam w Wiedniu."], ["Estoy aprendiendo español.", "Uczę się hiszpańskiego."], ["No entiendo.", "Nie rozumiem."], ["¿Puedes repetirlo?", "Możesz to powtórzyć?"], ["Habla más despacio, por favor.", "Mów wolniej, proszę."], ["¿Qué significa esta palabra?", "Co znaczy to słowo?"], ["¿Cómo se dice en español?", "Jak to się mówi po hiszpańsku?"], ["Tengo una pregunta.", "Mam pytanie."], ["Necesito ayuda.", "Potrzebuję pomocy."], ["Muchas gracias.", "Bardzo dziękuję."], ["De nada.", "Nie ma za co."], ["Perdón, lo siento.", "Przepraszam, przykro mi."], ["Hasta mañana.", "Do jutra."], ["Buenos días.", "Dzień dobry rano."], ["Buenas tardes.", "Dzień dobry po południu."], ["Buenas noches.", "Dobry wieczór lub dobranoc."], ["Que tengas un buen día.", "Miłego dnia."], ["Nos vemos pronto.", "Do zobaczenia wkrótce."], ["Tengo hambre.", "Jestem głodny."], ["Tengo sed.", "Chce mi się pić."], ["Quiero un café.", "Chcę kawę."], ["Quisiera una mesa para dos.", "Poproszę stolik dla dwóch osób."], ["¿Tiene el menú?", "Czy ma pan lub pani menu?"], ["¿Qué me recomienda?", "Co pan lub pani poleca?"], ["La cuenta, por favor.", "Rachunek, proszę."], ["Está delicioso.", "To jest pyszne."], ["No como carne.", "Nie jem mięsa."], ["Soy alérgico a los frutos secos.", "Mam alergię na orzechy."], ["¿Hay opciones vegetarianas?", "Czy są opcje wegetariańskie?"], ["Un vaso de agua, por favor.", "Szklankę wody, proszę."], ["Sin azúcar, por favor.", "Bez cukru, proszę."], ["¿Puedo pagar con tarjeta?", "Czy mogę zapłacić kartą?"], ["¿Cuánto cuesta?", "Ile to kosztuje?"], ["Es demasiado caro.", "To jest za drogie."], ["¿Tiene algo más barato?", "Czy ma pan lub pani coś tańszego?"], ["Solo estoy mirando.", "Tylko oglądam."], ["Me lo llevo.", "Biorę to."], ["¿Dónde está el baño?", "Gdzie jest toaleta?"], ["¿Dónde está la estación?", "Gdzie jest dworzec?"], ["¿Cómo llego al centro?", "Jak dojdę do centrum?"], ["Gira a la derecha.", "Skręć w prawo."], ["Gira a la izquierda.", "Skręć w lewo."], ["Sigue todo recto.", "Idź cały czas prosto."], ["Está cerca de aquí.", "To jest blisko stąd."], ["Está muy lejos.", "To jest bardzo daleko."], ["Necesito un billete.", "Potrzebuję biletu."], ["¿A qué hora sale el tren?", "O której odjeżdża pociąg?"], ["He perdido mi teléfono.", "Zgubiłem telefon."], ["¿Puede llamar a un taxi?", "Czy może pan lub pani wezwać taksówkę?"], ["Tengo una reserva.", "Mam rezerwację."], ["¿Hay wifi gratis?", "Czy jest darmowe Wi-Fi?"], ["¿A qué hora es el desayuno?", "O której jest śniadanie?"], ["Quiero una habitación tranquila.", "Chcę cichy pokój."], ["Hoy hace buen tiempo.", "Dziś jest ładna pogoda."], ["Hace mucho calor.", "Jest bardzo gorąco."], ["Hace frío.", "Jest zimno."], ["Está lloviendo.", "Pada deszcz."], ["Mañana va a hacer sol.", "Jutro będzie słonecznie."], ["¿Qué hora es?", "Która godzina?"], ["Son las ocho y media.", "Jest ósma trzydzieści."], ["Hoy es lunes.", "Dziś jest poniedziałek."], ["Mañana tengo tiempo.", "Jutro mam czas."], ["Ayer estuve ocupado.", "Wczoraj byłem zajęty."], ["Trabajo desde casa.", "Pracuję z domu."], ["Estoy de vacaciones.", "Jestem na wakacjach."], ["Tengo que trabajar.", "Muszę pracować."], ["Estoy cansado.", "Jestem zmęczony."], ["Necesito descansar.", "Muszę odpocząć."], ["Me gusta leer.", "Lubię czytać."], ["Me encanta viajar.", "Uwielbiam podróżować."], ["No me gusta esperar.", "Nie lubię czekać."], ["Prefiero el té.", "Wolę herbatę."], ["Quiero aprender más.", "Chcę nauczyć się więcej."], ["Puedo hablar un poco.", "Potrafię trochę mówić."], ["No puedo venir hoy.", "Nie mogę dziś przyjść."], ["¿Quieres venir conmigo?", "Chcesz pójść ze mną?"], ["Vamos a dar un paseo.", "Chodźmy na spacer."], ["¿Tienes planes para mañana?", "Masz plany na jutro?"], ["Estoy buscando a un amigo.", "Szukam przyjaciela."], ["Mi familia vive lejos.", "Moja rodzina mieszka daleko."], ["Tengo dos hermanos.", "Mam dwoje rodzeństwa."], ["Este es mi amigo.", "To jest mój przyjaciel."], ["Me alegro de verte.", "Cieszę się, że cię widzę."], ["Te echo de menos.", "Tęsknię za tobą."], ["Feliz cumpleaños.", "Wszystkiego najlepszego z okazji urodzin."], ["Buena suerte.", "Powodzenia."], ["No te preocupes.", "Nie martw się."], ["Todo va a salir bien.", "Wszystko będzie dobrze."], ["Estoy de acuerdo.", "Zgadzam się."], ["No estoy seguro.", "Nie jestem pewien."], ["Creo que sí.", "Myślę, że tak."], ["Creo que no.", "Myślę, że nie."], ["Es una buena idea.", "To dobry pomysł."], ["Tienes razón.", "Masz rację."], ["Depende del día.", "To zależy od dnia."], ["Necesito pensarlo.", "Muszę to przemyśleć."], ["¿Puedes ayudarme?", "Możesz mi pomóc?"], ["Tengo dolor de cabeza.", "Boli mnie głowa."], ["No me siento bien.", "Nie czuję się dobrze."], ["Necesito un médico.", "Potrzebuję lekarza."], ["¿Dónde hay una farmacia?", "Gdzie jest apteka?"], ["Llame a una ambulancia.", "Proszę wezwać karetkę."], ["Estoy listo para empezar.", "Jestem gotowy, żeby zacząć."]];
const verbs=[['SER — być','soy, eres, es, somos, sois, son','Soy de Polonia.','Tożsamość, pochodzenie i cechy.'],['ESTAR — być','estoy, estás, está, estamos, estáis, están','Estoy cansado.','Stan, samopoczucie i miejsce.'],['TENER — mieć','tengo, tienes, tiene, tenemos, tenéis, tienen','Tengo hambre.','Posiadanie, wiek i odczucia.'],['IR — iść / jechać','voy, vas, va, vamos, vais, van','Voy a estudiar.','Ir a + bezokolicznik oznacza zamiar.'],['HABLAR — mówić','hablo, hablas, habla, hablamos, habláis, hablan','Hablo español.','Regularny czasownik na -ar.'],['COMER — jeść','como, comes, come, comemos, coméis, comen','Como en casa.','Regularny czasownik na -er.'],['VIVIR — mieszkać','vivo, vives, vive, vivimos, vivís, viven','Vivo en Viena.','Regularny czasownik na -ir.'],['QUERER — chcieć','quiero, quieres, quiere, queremos, queréis, quieren','Quiero aprender.','Querer + bezokolicznik.'],['PODER — móc','puedo, puedes, puede, podemos, podéis, pueden','¿Puedes ayudarme?','Poder + bezokolicznik.'],['HACER — robić','hago, haces, hace, hacemos, hacéis, hacen','¿Qué haces?','Nieregularne yo hago.']];
const app=document.getElementById('app');let page='home',index=0,game=null,speakIndex=0;
function read(k,fallback){try{let v=JSON.parse(localStorage.getItem(k));return v===null?fallback:v}catch(e){return fallback}}
let fav=read('newspainFavorites',[]);if(!Array.isArray(fav))fav=[];
let progress=read('newspain2_progress',{});if(!progress||typeof progress!=='object')progress={};
let stats=read('newspain2_stats',{days:{},xp:0});if(!stats.days)stats={days:{},xp:0};
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function dayRecord(){let t=today();if(!stats.days[t])stats.days[t]={minutes:0,new:[],review:0,speaking:0,quiz:0};return stats.days[t]}
function save(){try{localStorage.setItem('newspainFavorites',JSON.stringify(fav));localStorage.setItem('newspain2_progress',JSON.stringify(progress));localStorage.setItem('newspain2_stats',JSON.stringify(stats))}catch(e){}}
function reward(x){stats.xp+=x;save()}
function logActivity(kind,amount=1){let d=dayRecord();if(kind==='new'){if(!d.new.includes(index))d.new.push(index)}else d[kind]=(d[kind]||0)+amount;reward(3)}
function dateShift(delta){let d=new Date();d.setDate(d.getDate()+delta);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function streak(){let count=0;let offset=stats.days[today()]?.minutes>0?0:-1;while(stats.days[dateShift(offset)]?.minutes>0){count++;offset--}return count}
function speak(s){if(!('speechSynthesis'in window)){alert('Brak syntezatora mowy.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='es-ES';u.rate=.8;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('es'))||null;speechSynthesis.speak(u)}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function setPage(p){page=p;game=null;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function toggle(i){fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];save();render()}
function sentence(i){let p=progress[i]||{};return `<div class="card"><span class="badge">Zdanie ${i+1} / ${data.length}</span><div class="es" lang="es">${escapeHtml(data[i][0])}</div><div class="pl">${escapeHtml(data[i][1])}</div><div class="actions"><button class="btn primary" onclick="speak(data[${i}][0])">🔊 Posłuchaj</button><button class="btn ${fav.includes(i)?'heart':''}" onclick="toggle(${i})">${fav.includes(i)?'♥ Usuń':'♡ Ulubione'}</button><button class="btn" onclick="rate(${i},false)">🔁 Trudne</button><button class="btn" onclick="rate(${i},true)">✓ Znam</button></div><p class="small">${p.next?'Następna powtórka: '+p.next:'Jeszcze nie oceniono'}</p></div>`}
function rate(i,known){let p=progress[i]||{level:0};p.level=known?Math.min(5,(p.level||0)+1):0;let delays=[1,1,3,7,14,30];p.next=dateShift(delays[p.level]);p.seen=true;progress[i]=p;logActivity('review');render()}
function move(n){index=(index+n+data.length)%data.length;render()}
function randomSentence(){index=Math.floor(Math.random()*data.length);render()}
function search(q){q=q.trim().toLowerCase();let box=document.getElementById('results');if(!q){box.innerHTML=sentence(index)+navigation();return}let ids=data.map((d,i)=>d.join(' ').toLowerCase().includes(q)?i:-1).filter(i=>i>=0).slice(0,20);box.innerHTML=ids.length?ids.map(sentence).join(''):'<div class="card">Brak wyników.</div>'}
function navigation(){return '<div class="actions"><button class="btn" onclick="move(-1)">← Poprzednie</button><button class="btn primary" onclick="move(1)">Następne →</button><button class="btn" onclick="randomSentence()">🎲 Losuj</button></div>'}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dueIds(){return data.map((_,i)=>i).filter(i=>progress[i]?.next&&progress[i].next<=today()).sort((a,b)=>progress[a].next.localeCompare(progress[b].next))}
function newIds(){return data.map((_,i)=>i).filter(i=>!progress[i]?.seen)}
function minutesAdd(n){let d=dayRecord();d.minutes=Math.min(240,(d.minutes||0)+n);reward(n*2);render()}
function home(){let d=dayRecord(),mins=d.minutes||0;let due=dueIds().length,learned=Object.values(progress).filter(p=>p.seen).length;let tasks=[['5 min','Powtórki','review'],['8 min','5 nowych zdań','sentences'],['7 min','Mówienie na głos','speaking'],['5 min','Quiz lub słuchanie','quiz'],['5 min','Gramatyka','grammar']];app.innerHTML=`<div class="card"><span class="badge">Twój trening na dziś</span><h2 style="margin-top:12px">¡Vamos a aprender! 🇪🇸</h2><p>Cel: <b>30 minut dziennie</b></p><div class="bar"><span style="width:${Math.min(100,mins/30*100)}%"></span></div><p class="small">${mins} / 30 minut — czas zaznaczasz po wykonaniu ćwiczenia</p><div class="grid"><div class="tile">🔥 Seria dni<b>${streak()}</b></div><div class="tile">⭐ Punkty XP<b>${stats.xp||0}</b></div><div class="tile">📚 Poznane zdania<b>${learned} / ${data.length}</b></div><div class="tile">🧠 Do powtórki<b>${due}</b></div></div></div><div class="card"><h2>Plan 30 minut</h2>${tasks.map(t=>`<div class="task"><div><b>${t[1]}</b><div class="small">${t[0]}</div></div><button class="btn primary" onclick="setPage('${t[2]}')">Ćwicz →</button></div>`).join('')}<p class="small">Po ćwiczeniu zaznacz przepracowany czas:</p><div class="actions"><button class="btn" onclick="minutesAdd(5)">+5 minut</button><button class="btn" onclick="minutesAdd(10)">+10 minut</button><button class="btn" onclick="minutesAdd(15)">+15 minut</button></div>${mins>=30?'<p>🏆 Brawo! Dzisiejszy cel osiągnięty.</p>':''}</div><div class="card"><h2>Twój następny krok</h2><p>${due?'Masz '+due+' zdań do powtórzenia.':'Brak zaległych powtórek. Poznaj kolejne zdania!'}</p><button class="btn primary" onclick="setPage('${due?'review':'sentences'}')">Zaczynam →</button></div>`}
function render(){if(page==='home'){home();return}if(page==='sentences'){app.innerHTML='<div class="card"><h2>📚 Zdania</h2><p class="small">Posłuchaj, zapisz ulubione i oznacz, czy znasz zdanie.</p><input placeholder="🔎 Szukaj po hiszpańsku lub polsku" oninput="search(this.value)"></div><div id="results">'+sentence(index)+navigation()+'</div>';return}if(page==='favorites'){app.innerHTML='<div class="card"><h2>❤️ Ulubione ('+fav.length+')</h2><p class="small">Twoje zapisane zdania z poprzedniej wersji.</p></div>'+(fav.length?fav.filter(i=>data[i]).map(sentence).join(''):'<div class="card">Nie masz jeszcze ulubionych.</div>');return}if(page==='review'){let ids=dueIds();app.innerHTML='<div class="card"><h2>🧠 Inteligentne powtórki</h2><p>Oceń zdanie jako „Znam” lub „Trudne”. Dobrze znane zdania wrócą za 3, 7, 14 lub 30 dni.</p><span class="badge">Dzisiaj do powtórki: '+ids.length+'</span></div>'+(ids.length?ids.slice(0,10).map(sentence).join(''):'<div class="card">🎉 Wszystkie zaplanowane powtórki gotowe! W sekcji Zdania oznacz nowe zdania jako „Znam” lub „Trudne”.</div>');return}if(page==='grammar'){grammar();return}if(page==='progress'){progressPage();return}if(page==='coach'){coachPage();return}if(page==='speaking'){speaking();return}if(!game){app.innerHTML='<div class="card"><h2>'+(page==='quiz'?'🏆 Quiz zdań':'🎧 Słuchanie')+'</h2><p>'+(page==='quiz'?'Wybierz poprawne tłumaczenie.':'Odsłuchaj zdanie i wybierz jego znaczenie.')+'</p><div class="actions"><button class="btn primary" onclick="start(10)">10 pytań</button><button class="btn primary" onclick="start(20)">20 pytań</button></div></div>';return}question()}
function start(n){game={ids:shuffle(data.map((_,i)=>i)).slice(0,n),at:0,score:0,choice:null,options:null};question()}
function question(){if(game.at>=game.ids.length&&!game.saved){game.saved=true;stats.quizHistory=stats.quizHistory||[];stats.quizHistory.push({date:today(),score:game.score,total:game.ids.length});stats.quizHistory=stats.quizHistory.slice(-100);save();logActivity('quiz')}if(game.at>=game.ids.length){app.innerHTML='<div class="card"><h2>🎉 Koniec quizu!</h2><div class="es">'+game.score+' / '+game.ids.length+'</div><p>+3 XP za ukończenie</p><div class="actions"><button class="btn primary" onclick="start('+game.ids.length+')">Jeszcze raz</button><button class="btn" onclick="game=null;render()">Wróć</button></div></div>';return}let id=game.ids[game.at];if(!game.options)game.options=shuffle([id,...shuffle(data.map((_,i)=>i).filter(i=>i!==id)).slice(0,3)]);let listen=page==='listening';let html='<div class="card"><span class="badge">Pytanie '+(game.at+1)+' / '+game.ids.length+' · '+game.score+' pkt</span>'+(listen?'<p>Odsłuchaj zdanie:</p><button class="btn primary" onclick="speak(data['+id+'][0])">🔊 Odtwórz</button>':'<div class="es">'+escapeHtml(data[id][0])+'</div><button class="btn" onclick="speak(data['+id+'][0])">🔊 Posłuchaj</button>');game.options.forEach((v,k)=>{let cls=game.choice!==null?(v===id?'correct':k===game.choice?'wrong':''):'';html+='<button class="option '+cls+'" '+(game.choice!==null?'disabled':'')+' onclick="answer('+k+')">'+'ABCD'[k]+'. '+escapeHtml(data[v][1])+'</button>'});if(game.choice!==null)html+='<p><b>'+(game.options[game.choice]===id?'✅ Dobrze!':'❌ Poprawnie: '+escapeHtml(data[id][1]))+'</b></p><button class="btn primary" onclick="next()">Dalej →</button>';app.innerHTML=html+'</div>'}
function answer(k){if(game.choice!==null)return;game.choice=k;if(game.options[k]===game.ids[game.at]){game.score++;reward(2)}question()}
function next(){game.at++;game.choice=null;game.options=null;question()}
function speaking(){app.innerHTML='<div class="card"><h2>🎤 Powtarzaj na głos</h2><span class="badge">Zdanie '+(speakIndex+1)+' / '+data.length+'</span><div class="es">'+escapeHtml(data[speakIndex][0])+'</div><div class="pl">'+escapeHtml(data[speakIndex][1])+'</div><div class="actions"><button class="btn primary" onclick="speak(data[speakIndex][0])">🔊 Posłuchaj</button><button class="btn" onclick="recognize()">🎤 Powiedz zdanie</button><button class="btn" onclick="spokenDone()">✓ Powtórzyłem</button></div><div id="speechResult" class="note" style="margin-top:15px">Jeśli mikrofon nie działa na iPhonie, możesz powtórzyć zdanie na głos i zaznaczyć „Powtórzyłem”.</div><div class="actions"><button class="btn" onclick="speakIndex=(speakIndex+1)%data.length;render()">Następne →</button></div></div>'}
function spokenDone(){logActivity('speaking');speakIndex=(speakIndex+1)%data.length;render()}
function normalize(s){return s.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zñ0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function recognize(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;let out=document.getElementById('speechResult');if(!SR){out.textContent='Ta przeglądarka nie udostępnia rozpoznawania mowy. Powtarzaj na głos i użyj „Powtórzyłem”.';return}let r=new SR();r.lang='es-ES';r.interimResults=false;r.maxAlternatives=1;out.textContent='🎤 Słucham…';r.onresult=e=>{let heard=e.results[0][0].transcript;let expected=data[speakIndex][0];let a=normalize(heard).split(' '),b=normalize(expected).split(' ');let hits=a.filter(x=>b.includes(x)).length;let score=Math.round(100*hits/Math.max(a.length,b.length));out.textContent='Rozpoznano: '+heard+' · zgodność słów około '+score+'%. To porównanie tekstu, nie profesjonalna ocena wymowy.';logActivity('speaking')};r.onerror=e=>{out.textContent='Mikrofon niedostępny ('+e.error+'). Możesz ćwiczyć bez automatycznej oceny.'};try{r.start()}catch(e){out.textContent='Nie udało się uruchomić mikrofonu.'}}
function grammar(){app.innerHTML='<div class="card"><h2>📖 Gramatyka</h2><div class="note"><b>Ser czy estar?</b><p>Soy de Polonia — pochodzenie. Estoy cansado — aktualny stan.</p><b>Rodzajniki:</b> el, la, un, una.<br><b>Pytania:</b> ¿Dónde? gdzie · ¿Cómo? jak · ¿Cuándo? kiedy.</div></div>'+verbs.map(v=>'<div class="card"><h3>'+escapeHtml(v[0])+'</h3><p>'+escapeHtml(v[3])+'</p><div class="note">'+v[1].split(', ').map((x,i)=>['yo ','tú ','él/ella ','nosotros ','vosotros ','ellos '][i]+escapeHtml(x)).join('<br>')+'</div><p>'+escapeHtml(v[2])+'</p><button class="btn primary" onclick="speak('+JSON.stringify(v[2]).replaceAll('"','&quot;')+')">🔊 Posłuchaj</button></div>').join('')}

// Wykres lokalny SVG: bez zewnętrznych bibliotek, działa również offline.
function progressPage(){
 const keys=Array.from({length:7},(_,i)=>dateShift(i-6));
 const values=keys.map(k=>Math.min(30,stats.days[k]?.minutes||0));
 const max=30, w=340,h=160, left=16,base=126,barW=27,step=46;
 let bars=values.map((v,i)=>{
  let bh=v/max*105,x=left+i*step,y=base-bh;
  let label=keys[i].slice(8);
  return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(1,bh)}" rx="5" fill="${v>=30?'#1e987b':'#2188a3'}"/><text x="${x+barW/2}" y="${Math.max(12,y-5)}" font-size="10" text-anchor="middle" fill="#38566a">${v}</text><text x="${x+barW/2}" y="146" font-size="10" text-anchor="middle" fill="#627c8d">${label}</text>`;
 }).join('');
 let completed=Object.values(progress).filter(p=>p.seen).length;
 let known=Object.values(progress).filter(p=>(p.level||0)>=2).length;
 let q=stats.quizHistory||[];
 let last=q.slice(-5);
 let accuracy=last.length?Math.round(last.reduce((sum,r)=>sum+r.score,0)/last.reduce((sum,r)=>sum+r.total,0)*100):null;
 let days30=values.filter(v=>v>=30).length;
 app.innerHTML=`<div class="card"><h2>📊 Twoje postępy</h2><p class="hint">Ostatnie 7 dni — zaznaczone minuty nauki. Zielony słupek oznacza osiągnięty cel 30 minut.</p>
 <svg class="chart" viewBox="0 0 340 160" role="img" aria-label="Wykres czasu nauki z ostatnich siedmiu dni"><line x1="12" y1="126" x2="338" y2="126" stroke="#cddde5"/><line x1="12" y1="21" x2="338" y2="21" stroke="#cddde5" stroke-dasharray="3 4"/>${bars}</svg>
 <div class="grid"><div class="tile">🎯 Dni z celem<b>${days30} / 7</b></div><div class="tile">🔥 Seria dni<b>${streak()}</b></div><div class="tile">📚 Poznane zdania<b>${completed} / ${data.length}</b></div><div class="tile">🧠 Utrwalone zdania<b>${known}</b></div></div></div>
 <div class="card"><h3>Wyniki quizów</h3><div class="metric">${accuracy===null?'—':accuracy+'%'}</div><p class="hint">Skuteczność z ostatnich ${last.length} quizów. To wynik ćwiczeń, nie ogólna ocena znajomości języka.</p><div class="bar"><span style="width:${accuracy||0}%"></span></div></div>
 <div class="card"><h3>Wskazówka Coacha</h3><p>${coachAdvice()}</p><button class="btn primary" onclick="setPage('coach')">🧑‍🏫 Przejdź do Coacha</button></div>`;
}
function coachAdvice(){
 const due=dueIds().length,learned=Object.values(progress).filter(p=>p.seen).length;
 const d=dayRecord(),mins=d.minutes||0;
 const qs=(stats.quizHistory||[]).slice(-3);
 const acc=qs.length?qs.reduce((n,q)=>n+q.score,0)/qs.reduce((n,q)=>n+q.total,0):null;
 if(due>0)return `Masz ${due} zdań do powtórki. Zacznij od nich — to najlepszy sposób, by nie zapominać.`;
 if(acc!==null&&acc<.7)return 'W ostatnich quizach zdarzały się pomyłki. Wróć do zdań i odsłuchaj je przed kolejnym testem.';
 if(mins<30)return `Dzisiaj zaznaczono ${mins} z 30 minut. Wybierz krótkie ćwiczenie, aby zbliżyć się do celu.`;
 if(learned<20)return 'Świetnie, dzisiejszy cel osiągnięty! Poznaj kolejne pięć zdań i wypowiedz je na głos.';
 return 'Dobra regularność! Spróbuj dziś wypowiedzieć 5 zdań bez patrzenia na tłumaczenie.';
}
let coachState={at:0,answered:false,choice:null};
const coachDialogs=[
 {context:'W kawiarni',prompt:'Kelner pyta: ¿Qué desea tomar?',choices:['Quiero un café, por favor.','Estoy en la estación.','Hace mucho frío.'],correct:0,why:'Quiero un café, por favor. = Poproszę kawę. To naturalna odpowiedź w kawiarni.'},
 {context:'W hotelu',prompt:'Recepcjonista pyta: ¿Tiene una reserva?',choices:['Gira a la izquierda.','Sí, tengo una reserva.','Son las ocho.'],correct:1,why:'Sí, tengo una reserva. = Tak, mam rezerwację.'},
 {context:'Na ulicy',prompt:'Ktoś pyta: ¿Dónde está la estación?',choices:['Tengo hambre.','Me gusta leer.','Sigue todo recto.'],correct:2,why:'Sigue todo recto. = Idź cały czas prosto.'},
 {context:'Poznawanie się',prompt:'Ktoś pyta: ¿De dónde eres?',choices:['Soy de Polonia.','Quiero agua.','Tengo una reserva.'],correct:0,why:'Soy de Polonia. = Jestem z Polski. Ser opisuje pochodzenie.'},
 {context:'W restauracji',prompt:'Chcesz poprosić o rachunek. Co powiesz?',choices:['¿Dónde está el baño?','La cuenta, por favor.','¿Qué hora es?'],correct:1,why:'La cuenta, por favor. = Rachunek, proszę.'},
 {context:'W sklepie',prompt:'Chcesz zapytać o cenę. Co powiesz?',choices:['¿Cuánto cuesta?','¿Cómo te llamas?','¿Dónde vives?'],correct:0,why:'¿Cuánto cuesta? = Ile to kosztuje?'}
];
function coachPage(){
 const c=coachDialogs[coachState.at%coachDialogs.length];
 let answer=coachState.answered;
 app.innerHTML=`<div class="card"><span class="badge">🧑‍🏫 Coach • dialog ${coachState.at%coachDialogs.length+1} / ${coachDialogs.length}</span>
 <h2 style="margin-top:12px">${c.context}</h2><div class="coachBubble"><b>Coach:</b> ${escapeHtml(c.prompt)}</div>
 <button class="btn" onclick="speak(${JSON.stringify(c.prompt)})">🔊 Posłuchaj Coacha</button>
 <p class="hint">Wybierz odpowiedź. Coach wyjaśni, dlaczego jest poprawna.</p>
 ${c.choices.map((v,i)=>`<button class="option coachChoice ${answer?(i===c.correct?'correct':i===coachState.choice?'wrong':''):''}" ${answer?'disabled':''} onclick="coachAnswer(${i})">${escapeHtml(v)}</button>`).join('')}
 ${answer?`<div class="coachBubble user"><b>${coachState.choice===c.correct?'✅ Dobrze!':'💡 Poprawmy to razem.'}</b><p>${escapeHtml(c.why)}</p><button class="btn" onclick="speak(${JSON.stringify(c.choices[c.correct])})">🔊 Posłuchaj poprawnej odpowiedzi</button></div><button class="btn primary" onclick="coachNext()">Następna sytuacja →</button>`:''}
 </div><div class="card"><h3>Twoja wskazówka na dziś</h3><p>${coachAdvice()}</p><p class="hint">Coach działa na podstawie przygotowanych dialogów, wyników quizów i powtórek. Nie jest swobodnie rozmawiającym AI i nie ocenia dokładności wymowy.</p></div>`;
}
function coachAnswer(i){
 if(coachState.answered)return;
 const c=coachDialogs[coachState.at%coachDialogs.length];
 coachState.answered=true;coachState.choice=i;
 if(i===c.correct)reward(3);
 else{stats.coachMistakes=(stats.coachMistakes||0)+1;save()}
 coachPage();
}
function coachNext(){coachState.at++;coachState.answered=false;coachState.choice=null;coachPage()}

render();
</script></body></html>
